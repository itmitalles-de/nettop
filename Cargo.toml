[package]
name = "nettop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An nvtop-inspired Linux network monitor with live graphs and per-process traffic"
license = "MIT"
repository = "https://github.com/itmitalles-de/nettop"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
libc = "0.2"
libloading = "0.8"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
strip = true
