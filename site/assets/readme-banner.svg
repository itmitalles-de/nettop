<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">nettop</title><desc id="desc">Your network, in view. A Linux terminal network monitor, with green receive and yellow send traces.</desc><rect width="1200" height="360" rx="18" fill="#0b1725"/><g fill="none" stroke="#233749" stroke-width="1"><path d="M600 50v260M700 50v260M800 50v260M900 50v260M1000 50v260M1100 50v260M550 100h600M550 160h600M550 220h600M550 280h600"/></g><path d="M562 221h69v-58h59v-52h68v80h65v-24h55v-74h67v50h71v-22h105" fill="none" stroke="#a3e48b" stroke-width="4"/><path d="M562 275h85v-31h75v18h68v-37h79v33h66v-56h70v30h116" fill="none" stroke="#f6cb68" stroke-width="4"/><g fill="#f0f4ee" font-family="Arial,Helvetica,sans-serif"><text x="60" y="168" font-size="110" font-weight="800" letter-spacing="-6">nettop</text><text x="65" y="223" font-size="30">Your network, in view.</text><text x="65" y="286" font-size="17" fill="#b5c4ce">Linux terminal monitor</text><text x="820" y="325" font-family="monospace" font-size="16" fill="#a3e48b">RX receive</text><text x="994" y="325" font-family="monospace" font-size="16" fill="#f6cb68">TX send</text></g></svg>
