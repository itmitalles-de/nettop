name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  pull_request:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate entrypoint and domain
        run: |
          test -s site/index.html
          test "$(cat site/CNAME)" = "nettop.wutz.io"
      - name: Package static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify public HTTPS endpoint
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 6 --retry-all-errors --retry-delay 10 --retry-max-time 180 \
            --connect-timeout 10 --max-time 25 \
            https://nettop.wutz.io/ -o "$RUNNER_TEMP/nettop-index.html"
          python3 - <<'PY'
          import os
          from pathlib import Path
          html = (Path(os.environ["RUNNER_TEMP"]) / "nettop-index.html").read_text()
          assert '<title>nettop — your network, in view</title>' in html
          assert 'assets/nettop-demo.mp4' in html
          PY
