name: CI

on:
  # Pull requests are tested once through pull_request; pushes only for main.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extended:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install optional backend build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libbpf-dev
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: extended
      - name: Lint optional backend
        run: cargo +stable clippy --locked --all-targets --features ebpf -- -D warnings
      - name: Test optional backend on minimum supported Rust
        run: cargo +1.88.0 test --locked --features ebpf
      - name: Build optional backend
        run: cargo +stable build --release --locked --features ebpf
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.88.0 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: msrv
      - name: Test minimum supported Rust
        run: cargo +1.88.0 test --locked
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: stable
      - name: Check formatting
        run: cargo +stable fmt --check
      - name: Lint
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +stable test --locked
      - name: Build release
        run: cargo +stable build --release --locked
      - name: Test terminal restoration
        run: python3 tests/terminal.py target/release/nettop
      - name: Test Setup and saved preferences
        run: python3 tests/setup.py target/release/nettop
      - name: Build isolated capture environment
        run: docker build --tag nettop-test tests
      - name: Test live TCP and UDP capture
        run: >-
          docker run --rm --network none --volume "$PWD:/work:ro"
          nettop-test python3 tests/live_capture.py target/release/nettop
      - name: Test attribution of sockets closed within one interval
        run: >-
          docker run --rm --network none --volume "$PWD:/work:ro"
          nettop-test python3 tests/short_lived.py target/release/nettop
      - name: Test unprivileged UI and capability helper
        run: >-
          docker run --rm --network none --cap-add DAC_READ_SEARCH --cap-add SYS_PTRACE
          --volume "$PWD:/work:ro" nettop-test
          python3 tests/helper.py --isolated target/release/nettop target/release/nettop-collector
      - name: Check installer
        run: shellcheck scripts/*.sh
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: audit
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.2
      - name: Audit dependencies for known vulnerabilities
        run: cargo audit
